function splitWords(str){
  var res=[],w="";
  for(var i=0;i<str.length;i++){
    var ch=str.charAt(i);
    if(ch===" "||ch==="."){if(w.length>0){res.push(w);w="";}}
    else{w+=ch;}
  }
  if(w.length>0) res.push(w);
  return res;
}

function matchBet(b){
  var t=((b.game||"")+" "+(b.team||"")+" "+(b.opponent||"")).toLowerCase();
  for(var i=0;i<flat.length;i++){
    var ps=splitWords(flat[i].t1||"".toLowerCase()).concat(splitWords((flat[i].t2||"").toLowerCase()));
    for(var j=0;j<ps.length;j++){if(ps[j].length>2&&t.indexOf(ps[j])>=0) return flat[i].id;}
  }
  return null;
}

function getGamePL(gid){
  var pl=0,hasBet=false;
  for(var i=0;i<straightBets.length;i++){
    var b=straightBets[i];
    if(b.assignedGame!==gid) continue;
    hasBet=true;
    if(b.result==="win") pl+=(b.potentialPayout||0)-(b.stake||0);
    else if(b.result==="loss") pl-=(b.stake||0);
  }
  return {pl:pl,hasBet:hasBet};
}

function getRoundStats(){
  var rounds={R64:{n:"Round of 64",bets:0,wi:0,lo:0,st:0,pl:0},R32:{n:"Round of 32",bets:0,wi:0,lo:0,st:0,pl:0},S16:{n:"Sweet 16",bets:0,wi:0,lo:0,st:0,pl:0},E8:{n:"Elite 8",bets:0,wi:0,lo:0,st:0,pl:0},F4:{n:"Final Four",bets:0,wi:0,lo:0,st:0,pl:0},Championship:{n:"Championship",bets:0,wi:0,lo:0,st:0,pl:0}};
  for(var i=0;i<straightBets.length;i++){
    var b=straightBets[i];
    var g=null;
    for(var j=0;j<flat.length;j++){if(flat[j].id===b.assignedGame){g=flat[j];break;}}
    var rk=g?g.round:"R64";
    if(!rounds[rk]) continue;
    rounds[rk].bets++;
    rounds[rk].st+=b.stake||0;
    if(b.result==="win"){rounds[rk].wi++;rounds[rk].pl+=(b.potentialPayout||0)-(b.stake||0);}
    if(b.result==="loss"){rounds[rk].lo++;rounds[rk].pl-=(b.stake||0);}
  }
  return rounds;
}

function getParlayStats(){
  var total=0,wi=0,lo=0,st=0,pl=0;
  for(var i=0;i<parlays.length;i++){
    var p=parlays[i];
    total++;st+=p.stake||0;
    if(p.result==="win"){wi++;pl+=(p.potentialPayout||0)-(p.stake||0);}
    if(p.result==="loss"){lo++;pl-=(p.stake||0);}
  }
  return{total:total,wi:wi,lo:lo,st:st,pl:pl};
}

function gameCard(g){
  var info=getGamePL(g.id);
  var cls="gm";
  if(info.hasBet){
    var hasPending=false,hasWin=false,hasLoss=false;
    for(var i=0;i<straightBets.length;i++){
      var b=straightBets[i];
      if(b.assignedGame!==g.id) continue;
      if(b.result==="win") hasWin=true;
      else if(b.result==="loss") hasLoss=true;
      else hasPending=true;
    }
    if(hasLoss&&!hasWin&&!hasPending) cls="gm lr";
    else if(hasWin&&!hasLoss&&!hasPending) cls="gm wr";
    else cls="gm hb";
  }
  var plBadge="";
  if(info.hasBet&&(info.pl!==0)){
    var isPos=info.pl>0;
    plBadge='<span class="gm-pl '+(isPos?"pos":"neg")+'">'+(isPos?"+":"")+"$"+Math.abs(info.pl).toFixed(0)+'</span>';
  }
  var isT=g.d==="Thu";
  var badge="";
  var betsForGame=[];
  for(var i=0;i<straightBets.length;i++){if(straightBets[i].assignedGame===g.id) betsForGame.push(straightBets[i]);}
  var br=betsForGame.length>0?betsForGame[0].result:null;
  if(br){var bc=br==="win"?"#059669":br==="loss"?"#dc2626":"#d97706";badge='<div class="rb" style="background:'+bc+'">'+br.charAt(0).toUpperCase()+'</div>';}
  var gr=gameResults[g.id];
  var statusBadge='';var scoreStr='';
  if(gr&&gr.isFinal){statusBadge='<span class="gm-final">FINAL</span>';scoreStr='<span class="gm-score">'+gr.awayScore+'-'+gr.homeScore+'</span>';}
  else if(gr&&gr.isLive){statusBadge='<span class="gm-live">LIVE</span>';scoreStr='<span class="gm-score">'+gr.awayScore+'-'+gr.homeScore+'</span>';}
  var t1disp=g.t1;var t2disp=g.t2;
  if(gr&&gr.isFinal&&gr.winner){
    if(!teamNamesMatch(gr.winner,g.t1)) t1disp='<span style="opacity:0.38;text-decoration:line-through">'+g.t1+'</span>';
    if(!teamNamesMatch(gr.winner,g.t2)) t2disp='<span style="opacity:0.38;text-decoration:line-through">'+g.t2+'</span>';
  }

function buildRegion(reg,rev){
  var r1="",r2="",r3="",r4="",c1="",c2="",c3="";
  for(var i=0;i<8;i++) r1+=gameCard(reg.g[i]);
  for(var i=0;i<4;i++){r2+=slot("Round of 32");c1+=connSvg(rev);}
  for(var i=0;i<2;i++){r3+=slot("Sweet 16");c2+=connSvg(rev);}
  r4=slot("Elite 8");c3=connSvg(rev);
  var cols=[rndWrap(r1),rndWrap(c1),rndWrap(r2),rndWrap(c2),rndWrap(r3),rndWrap(c3),rndWrap(r4)];

  if(rev) return '<div class="reg-block">'+cols.join('')+lbl+'</div>';
  return '<div class="reg-block">'+lbl+cols.join('')+'</div>';
}


// ---- ESPN AUTO-GRADING ----

function teamNamesMatch(espnName, ourName){
  if(!espnName||!ourName) return false;
  var a=espnName.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
  var b=ourName.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
  if(a===b) return true;
  // Check if any word from our name appears in ESPN name or vice versa
  var aw=a.split(' ');var bw=b.split(' ');
  for(var i=0;i<aw.length;i++){
    if(aw[i].length>3&&b.indexOf(aw[i])>=0) return true;
  }
  for(var i=0;i<bw.length;i++){
    if(bw[i].length>3&&a.indexOf(bw[i])>=0) return true;
  }
  return false;
}

function findGameByTeams(homeTeam, awayTeam){
  for(var i=0;i<flat.length;i++){
    var g=flat[i];
    if(!g.t1||!g.t2) continue;
    if((teamNamesMatch(homeTeam,g.t1)||teamNamesMatch(awayTeam,g.t1))&&
       (teamNamesMatch(homeTeam,g.t2)||teamNamesMatch(awayTeam,g.t2))){
      return g.id;
    }
  }
  return null;
}

var autoGradeLog=[];

function applyScores(games){
  var newGrades=0;
  for(var i=0;i<games.length;i++){
    var eg=games[i];
    var gid=findGameByTeams(eg.homeTeam,eg.awayTeam);
    if(!gid) continue;

    // Store result info for display
    gameResults[gid]={
      isFinal:eg.isFinal,
      isLive:eg.isLive,
      winner:eg.winner,
      statusText:eg.statusText,
      homeTeam:eg.homeTeam,
      awayTeam:eg.awayTeam,
      homeScore:eg.homeScore,
      awayScore:eg.awayScore
    };

    if(!eg.isFinal||!eg.winner) continue;

    // Record bracket winner
    bracketWinners[gid]=eg.winner;

    // Auto-grade straight bets on this game
    for(var j=0;j<straightBets.length;j++){
      var b=straightBets[j];
      if(b.assignedGame!==gid) continue;
      if(b.result) continue; // already graded, don't overwrite manual grades
      if(!b.team) continue;

      var betOnWinner=teamNamesMatch(eg.winner,b.team);
      // For moneyline/spread we can auto-grade; for totals we can't know without the score spread
      if(b.betType&&b.betType.toLowerCase().indexOf('total')>=0) continue;

      b.result=betOnWinner?'win':'loss';
      b.autoGraded=true;
      newGrades++;
      autoGradeLog.push({team:b.team,result:b.result,game:gid});
    }
  }
  return newGrades;
}

function fetchScores(){
  fetch(API_BASE_URL+'/api/scores')
    .then(function(r){return r.json();})
    .then(function(data){
      if(!data.games) return;
      var graded=applyScores(data.games);
      lastScoreFetch=Date.now();
      if(graded>0||Object.keys(gameResults).length>0) draw();
    })
    .catch(function(err){console.warn('Score fetch failed:',err);});
}

function startScorePolling(){
  fetchScores(); // immediate first fetch
  if(scoreFetchInterval) clearInterval(scoreFetchInterval);
  scoreFetchInterval=setInterval(fetchScores, 120000); // every 2 min
}

          btns+='<button class="rbt" data-r="push" data-b="'+p.id+'" data-type="parlay" style="background:#f59e0b">PUSH</button></div>';
        }else{
          var xc=p.result==="win"?"#10b981":p.result==="loss"?"#ef4444":"#f59e0b";
          btns='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span style="font-weight:700;font-size:14px;color:'+xc+'">'+(pp>=0?"+":"")+'$'+Math.abs(pp).toFixed(2)+'</span><button class="rbt" data-r="undo" data-b="'+p.id+'" data-type="parlay" style="background:#1e293b;flex:0;padding:4px 10px;font-size:10px">Undo</button></div>';
        }
        var legCount=p.legs?p.legs.length:0;
        h+='<div class="pi">';
        h+='<div style="display:flex;justify-content:space-between;align-items:center">';
        h+='<div><span style="font-weight:700;font-size:14px;color:#f97316">'+legCount+'-Leg Parlay</span>';
        h+='<span style="color:#64748b;font-size:11px;margin-left:6px">'+p.sportsbook+'</span></div>';
        h+='<div style="font-weight:700">$'+(p.stake||0).toFixed(2)+' &rarr; $'+(p.potentialPayout||0).toFixed(2)+'</div></div>';
        if(p.legs&&p.legs.length){
          h+='<div class="parlay-legs">';
          for(var j=0;j<p.legs.length;j++){
            var leg=p.legs[j];
            h+='<div class="leg"><span class="leg-dot"></span><span style="color:#fbbf24;font-weight:600">'+(leg.team||"?")+'</span>&nbsp;<span style="color:#64748b">'+(leg.betType||"")+'</span>&nbsp;<span style="color:#94a3b8">'+(leg.odds||"")+'</span></div>';
          }
          h+='</div>';
        }
        h+=btns+'</div>';
      }
    }
    h+='</div>';

  }else if(curTab==="stats"){
    var rs=getRoundStats();
    var ps2=getParlayStats();
    h+='<div class="lst">';
    h+='<div style="font-size:15px;font-weight:800;margin-bottom:12px;color:#e2e8f0">Round-by-Round Stats</div>';
    var rounds=["R64","R32","S16","E8","F4","Championship"];
    for(var ri2=0;ri2<rounds.length;ri2++){
      var rk=rounds[ri2];
      var rd=rs[rk];
      if(!rd) continue;
      var rplC=rd.pl>=0?"#10b981":"#ef4444";
      h+='<div class="bi" style="border-left-color:#00b4d8;margin-bottom:8px">';
      h+='<div style="display:flex;justify-content:space-between;align-items:center">';
      h+='<div><span style="font-weight:800;font-size:14px;color:#00b4d8">'+rd.n+'</span></div>';
      h+='<div style="font-weight:700;color:'+rplC+'">'+(rd.pl>=0?"+":"")+'$'+Math.abs(rd.pl).toFixed(2)+'</div></div>';
      h+='<div style="display:flex;gap:20px;margin-top:8px;font-size:12px">';
      h+='<span><span style="color:#64748b">Bets: </span><span style="font-weight:700">'+rd.bets+'</span></span>';
      h+='<span><span style="color:#64748b">Record: </span><span style="font-weight:700">'+rd.wi+'-'+rd.lo+'</span></span>';
      h+='<span><span style="color:#64748b">Staked: </span><span style="font-weight:700">$'+rd.st.toFixed(2)+'</span></span>';
      h+='</div></div>';
    }
    // Parlay summary row
    h+='<div style="font-size:15px;font-weight:800;margin:16px 0 12px;color:#e2e8f0">Parlay Summary</div>';
    var pplC=ps2.pl>=0?"#10b981":"#ef4444";
    h+='<div class="pi" style="margin-bottom:8px">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center">';
    h+='<span style="font-weight:800;font-size:14px;color:#f97316">All Parlays</span>';
    h+='<span style="font-weight:700;color:'+pplC+'">'+(ps2.pl>=0?"+":"")+'$'+Math.abs(ps2.pl).toFixed(2)+'</span></div>';
    h+='<div style="display:flex;gap:20px;margin-top:8px;font-size:12px">';
    h+='<span><span style="color:#64748b">Parlays: </span><span style="font-weight:700">'+ps2.total+'</span></span>';
    h+='<span><span style="color:#64748b">Record: </span><span style="font-weight:700">'+ps2.wi+'-'+ps2.lo+'</span></span>';
    h+='<span><span style="color:#64748b">Staked: </span><span style="font-weight:700">$'+ps2.st.toFixed(2)+'</span></span>';
    h+='</div></div>';
    h+='</div>';
  }

  h+='</div>';
  document.getElementById("app").innerHTML=h;
  bindEvents();
}

function bindEvents(){
  var upBtn=document.getElementById("upBtn");
  if(upBtn) upBtn.addEventListener("click",function(){if(!isParsing) document.getElementById("fi").click();});

  var fi=document.getElementById("fi");
  if(fi) fi.addEventListener("change",function(){
    var files=this.files;
    if(!files||!files.length) return;
    doUpload(files);
    this.value="";
  });

  var tabs=document.querySelectorAll("[data-tab]");
  for(var i=0;i<tabs.length;i++){
    tabs[i].addEventListener("click",function(){curTab=this.getAttribute("data-tab");draw();});
  }

  var selects=document.querySelectorAll("[data-assign]");
  for(var i=0;i<selects.length;i++){
    selects[i].addEventListener("change",function(){
      var bid=this.getAttribute("data-assign");
      var gid=this.value;
      if(!gid) return;
      for(var j=0;j<straightBets.length;j++){if(straightBets[j].id===bid){straightBets[j].assignedGame=gid;break;}}
      saveToStorage();
      draw();
    });
  }

  // Drag and drop anywhere on page
  var overlay=document.getElementById("dragOverlay");
  var dragCounter=0;
  document.addEventListener("dragenter",function(ev){
    ev.preventDefault();
    dragCounter++;
    if(overlay) overlay.className="drag-overlay active";
  });
  document.addEventListener("dragleave",function(ev){
    dragCounter--;
    if(dragCounter<=0){dragCounter=0;if(overlay) overlay.className="drag-overlay";}
  });
  document.addEventListener("dragover",function(ev){ev.preventDefault();});
  document.addEventListener("drop",function(ev){
    ev.preventDefault();
    dragCounter=0;
    if(overlay) overlay.className="drag-overlay";
    var files=ev.dataTransfer.files;
    if(files&&files.length&&!isParsing) doUpload(files);
  });

  document.getElementById("app").addEventListener("click",function(ev){
    var el=ev.target;
    if(el.getAttribute&&el.getAttribute("data-b")){
      var bid=el.getAttribute("data-b");
      var rv=el.getAttribute("data-r");
      var btype=el.getAttribute("data-type");
      var arr=btype==="parlay"?parlays:straightBets;
      for(var i=0;i<arr.length;i++){
        if(arr[i].id===bid){arr[i].result=rv==="undo"?null:rv;break;}
      }
      draw();
    }
  });
}

function setParsingState(active,msg){
  isParsing=active;
  var bar=document.getElementById("parsingBar");
  if(bar){
    bar.className="parsing-bar"+(active?" active":"");
    var msgEl=document.getElementById("parsingMsg");
    if(msgEl&&msg) msgEl.textContent=msg;
  }
}

function doUpload(files){
  if(!files||!files.length) return;
  var idx=0;
  function next(){
    if(idx>=files.length){setParsingState(false);draw();return;}
    var f=files[idx];idx++;
    setParsingState(true,"Parsing "+f.name+" ("+idx+" of "+files.length+")...");
    var reader=new FileReader();
    reader.onerror=function(){logz.push({f:f.name,ok:false,msg:"Failed to read file"});next();};
    reader.onload=function(){
      var b64=reader.result.split(",")[1];
      var mediaType=f.type||"image/png";
      fetch(API_BASE_URL+"/api/parse-slip",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({image:b64,mediaType:mediaType})
      }).then(function(r){return r.json();}).then(function(data){
        if(data.error){logz.push({f:f.name,ok:false,msg:data.error});next();return;}
        var txt="";
        for(var c=0;c<data.content.length;c++){txt+=data.content[c].text||"";}
        var clean="";
        for(var i=0;i<txt.length;i++){if(txt.charAt(i)!=="`") clean+=txt.charAt(i);}
        clean=clean.trim();
        if(clean.indexOf("json")===0) clean=clean.substring(4).trim();
        var parsed=JSON.parse(clean);

        // Parsed result is either an array (for straight) or object with bets+parlays
        var straightArr=[];
        var parlayArr=[];

        if(Array.isArray(parsed)){
          // Separate parlays from straight bets
          for(var j=0;j<parsed.length;j++){
            var item=parsed[j];
            if(item.isParlay||item.betType==="Parlay"||(item.legs&&item.legs.length>1)){
              parlayArr.push(item);
            }else{
              straightArr.push(item);
            }
          }
        }else if(parsed.bets||parsed.parlays){
          straightArr=parsed.bets||[];
          parlayArr=parsed.parlays||[];
        }

        var newStraight=0,newParlay=0;
        for(var j=0;j<straightArr.length;j++){
          var item=straightArr[j];
          straightBets.push({
            team:item.team,opponent:item.opponent,game:item.game,
            betType:item.betType,odds:item.odds,
            id:"b"+Date.now()+"_"+j,
            stake:parseFloat(item.stake)||0,
            potentialPayout:parseFloat(item.potentialPayout)||0,
            result:null,
            assignedGame:matchBet(item)
          });
          newStraight++;
        }
        for(var j=0;j<parlayArr.length;j++){
          var item=parlayArr[j];
          parlays.push({
            id:"p"+Date.now()+"_"+j,
            sportsbook:item.sportsbook||"",
            stake:parseFloat(item.stake)||0,
            potentialPayout:parseFloat(item.potentialPayout)||0,
            legs:item.legs||[],
            result:null
          });
          newParlay++;
        }
        var msg="";
        if(newStraight>0) msg+=newStraight+" straight bet"+(newStraight>1?"s":"");
        if(newParlay>0) msg+=(msg?", ":"")+newParlay+" parlay"+(newParlay>1?"s":"");
        logz.push({f:f.name,ok:true,n:msg||"0 bets"});
        saveToStorage();
        next();
      }).catch(function(){logz.push({f:f.name,ok:false,msg:"Network error - check API_BASE_URL"});next();});
    };
    reader.readAsDataURL(f);
  }
  next();
}

loadFromStorage();
startScorePolling();
draw();
</script>
</body>
</html>

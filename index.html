function deleteBet(bid,btype){
  if(btype==="parlay"){parlays=parlays.filter(function(p){return p.id!==bid;});}
  else{straightBets=straightBets.filter(function(b){return b.id!==bid;});}
  saveToStorage();draw();
}

function isFirstHalfBet(b){
  var bt=(b.betType||"").toLowerCase();
  return bt.indexOf("1st half")>=0||bt.indexOf("first half")>=0||bt.indexOf("1h ")>=0||bt.indexOf("h1")>=0;
}

function isPropBet(b){
  var bt=(b.betType||"").toLowerCase();
  return bt.indexOf("prop")>=0||bt.indexOf("points")>=0||bt.indexOf("assists")>=0||bt.indexOf("rebounds")>=0||bt.indexOf("threes")>=0||bt.indexOf("blocks")>=0||bt.indexOf("steals")>=0;

function saveToStorage(){
  try{
    localStorage.setItem('mmbt_straight',JSON.stringify(straightBets));
    localStorage.setItem('mmbt_parlays',JSON.stringify(parlays));
  }catch(e){console.warn('Save failed:',e);}
}

function loadFromStorage(){
  try{
    var s=localStorage.getItem('mmbt_straight');
    var p=localStorage.getItem('mmbt_parlays');
    if(s) straightBets=JSON.parse(s);
    if(p) parlays=JSON.parse(p);
  }catch(e){console.warn('Load failed:',e);}
}

function clearStorage(){
  if(!confirm('Clear all your bets? This cannot be undone.')) return;
  localStorage.removeItem('mmbt_straight');
  localStorage.removeItem('mmbt_parlays');
  straightBets=[];parlays=[];autoGradeLog=[];

function splitWords(str){
  var res=[],w="";
  for(var i=0;i<str.length;i++){
    var ch=str.charAt(i);
    if(ch===" "||ch==="."){if(w.length>0){res.push(w);w="";}}
    else{w+=ch;}
  }
  if(w.length>0) res.push(w);
  return res;
}

function matchBet(b){
  // If both team and opponent known, require BOTH to match same game
  if(b.team&&b.opponent){
    for(var i=0;i<flat.length;i++){
      var g=flat[i];if(!g.t1||!g.t2) continue;
      if((teamNamesMatch(g.t1,b.team)||teamNamesMatch(g.t2,b.team))&&
         (teamNamesMatch(g.t1,b.opponent)||teamNamesMatch(g.t2,b.opponent))) return g.id;
    }
  }
  // Single team fallback
  var t=((b.game||"")+" "+(b.team||"")).toLowerCase();
  for(var i=0;i<flat.length;i++){
    var g=flat[i];if(!g.t1||!g.t2) continue;
    var ps=splitWords(g.t1.toLowerCase()).concat(splitWords(g.t2.toLowerCase()));
    for(var j=0;j<ps.length;j++){if(ps[j].length>3&&!{state:1,university:1,north:1,south:1}[ps[j]]&&t.indexOf(ps[j])>=0) return g.id;}
  }
  return null;
}

function getGamePL(gid){
  var pl=0,hasBet=false;
  for(var i=0;i<straightBets.length;i++){
    var b=straightBets[i];
    if(b.assignedGame!==gid) continue;
    hasBet=true;
    if(b.result==="win") pl+=(b.potentialPayout||0)-(b.stake||0);
    else if(b.result==="loss") pl-=(b.stake||0);
  }
  return {pl:pl,hasBet:hasBet};
}

function gameCard(g){
  var info=getGamePL(g.id);
  var cls="gm";
  if(info.hasBet){
    var hasPending=false,hasWin=false,hasLoss=false;
    for(var i=0;i<straightBets.length;i++){
      var b=straightBets[i];
      if(b.assignedGame!==g.id) continue;
      if(b.result==="win") hasWin=true;
      else if(b.result==="loss") hasLoss=true;
      else hasPending=true;
    }
    if(hasLoss&&!hasWin&&!hasPending) cls="gm lr";
    else if(hasWin&&!hasLoss&&!hasPending) cls="gm wr";
    else cls="gm hb";
  }
  var plBadge="";
  if(info.hasBet&&info.pl!==0){
    var isPos=info.pl>0;
    plBadge='<span class="gm-pl '+(isPos?"pos":"neg")+'">'+( isPos?"+":"")+"$"+Math.abs(info.pl).toFixed(0)+'</span>';
  }
  var betsForGame=[];
  for(var i=0;i<straightBets.length;i++){if(straightBets[i].assignedGame===g.id) betsForGame.push(straightBets[i]);}
  var br=betsForGame.length>0?betsForGame[0].result:null;
  var badge="";
  if(br){var bc=br==="win"?"#059669":br==="loss"?"#dc2626":"#d97706";badge='<div class="rb" style="background:'+bc+'">'+br.charAt(0).toUpperCase()+'</div>';}
  var gr=gameResults[g.id];
  var statusBadge="";var scoreStr="";
  if(gr&&gr.isFinal){statusBadge='<span class="gm-final">FINAL</span>';scoreStr='<span class="gm-score">'+abbr(gr.awayTeam)+' '+gr.awayScore+' - '+gr.homeScore+' '+abbr(gr.homeTeam)+'</span>';}
  else if(gr&&gr.isLive){statusBadge='<span class="gm-live">LIVE</span>';scoreStr='<span class="gm-score">'+abbr(gr.awayTeam)+' '+gr.awayScore+' - '+gr.homeScore+' '+abbr(gr.homeTeam)+'</span>';}
  var t1disp=g.t1;var t2disp=g.t2;
  if(gr&&gr.isFinal&&gr.winner){
    if(!teamNamesMatch(gr.winner,g.t1)) t1disp='<span style="opacity:0.38;text-decoration:line-through">'+g.t1+'</span>';
    if(!teamNamesMatch(gr.winner,g.t2)) t2disp='<span style="opacity:0.38;text-decoration:line-through">'+g.t2+'</span>';
  }
  var pendingStrip="";
  for(var pi=0;pi<betsForGame.length;pi++){
    var pb=betsForGame[pi];
    var pcolor=pb.result==="win"?"#10b981":pb.result==="loss"?"#ef4444":pb.result==="push"?"#f59e0b":"#94a3b8";
    pendingStrip+='<div style="font-size:9px;padding:2px 8px;color:'+pcolor+';border-top:1px solid #1c2640">'+( pb.betType||pb.team||"Bet")+' $'+(pb.stake||0).toFixed(0)+(pb.result?' - '+pb.result.toUpperCase():' - Pending')+'</div>';
  }
  var isExpanded=activeGameModal===g.id;
  var drawer="";
  if(isExpanded){
    drawer+='<div style="background:#080c18;border-top:1px solid #1c2640;padding:8px">';
    if(!betsForGame.length){
      drawer+='<div style="color:#475569;font-size:10px;text-align:center;padding:4px">No bets on this game</div>';
    }else{
      for(var di=0;di<betsForGame.length;di++){
        var db=betsForGame[di];
        var dbc=db.result==="win"?"#10b981":db.result==="loss"?"#ef4444":db.result==="push"?"#f59e0b":"#94a3b8";
        var isHalf=isFirstHalfBet(db);var isProp=isPropBet(db);
        var dtag=isHalf?'<span style="font-size:8px;background:#1e3a5f;color:#60a5fa;padding:1px 4px;border-radius:2px;margin-left:3px">1H</span>':isProp?'<span style="font-size:8px;background:#3b1f5f;color:#c084fc;padding:1px 4px;border-radius:2px;margin-left:3px">PROP</span>':''
        var dbp=db.result==="win"?((db.potentialPayout||0)-(db.stake||0)):db.result==="loss"?-(db.stake||0):null;
        drawer+='<div style="padding:6px 0;border-bottom:1px solid #1c2640;font-size:11px">';
        drawer+='<div style="display:flex;justify-content:space-between;align-items:center">';
        drawer+='<span style="font-weight:700;color:#fbbf24">'+( db.betType||db.team||"Bet")+dtag+'</span>';
        drawer+='<span style="color:#e2e8f0;font-weight:700">$'+(db.stake||0).toFixed(2)+' @ '+(db.odds||"?")+'</span>';
        drawer+='</div>';
        if(dbp!==null) drawer+='<div style="color:'+dbc+';font-weight:700;font-size:10px;margin-top:2px">'+(dbp>=0?"+":"")+"$"+Math.abs(dbp).toFixed(2)+' - '+db.result.toUpperCase()+(db.autoGraded?' (auto)':'')+'</div>';
        else drawer+='<div style="font-size:10px;color:#475569;margin-top:2px">Pending — auto-grades when final</div>';
        drawer+='</div>';
      }
    }
    drawer+='</div>';
  }
  return '<div class="'+(isExpanded?"gm hb":""+cls)+'" onclick="showGameModal(\"'  +g.id+'\")" style="cursor:pointer">'
    +'<div class="tr"><span class="sd">('+ g.s1+')</span><span class="tn'+(info.hasBet?" bt":"")+'">'+t1disp+plBadge+'</span>'+statusBadge+scoreStr+'</div>'
    +'<div class="tr"><span class="sd">('+ g.s2+')</span><span class="tn">'+t2disp+'</span><span class="tm-t">'+g.d+' '+g.tm+' '+g.tv+'</span></div>'
    +pendingStrip+drawer+badge+'</div>';
}

function rndWrap(inner){return '<div class="rnd">'+inner+'</div>';}

function liveSlot(g1id,g2id,round,espnScheduled){
  var w1=bracketWinners[g1id]||null;
  var w2=bracketWinners[g2id]||null;
  if(!w1&&!w2) return slot(round);
  var t1=abbr(w1)||'TBD';var t2=abbr(w2)||'TBD';
  // Only show live/final status if BOTH teams have advanced from R64
  // This prevents ESPN pre-seeded future games from showing as final
  var bothAdvanced=w1&&w2;
  var gr=bothAdvanced?(espnScheduled||null):null;
  var statusBadge="";var timeInfo="";
  if(gr&&gr.isFinal) statusBadge='<span class="gm-final">FINAL</span>';
  else if(gr&&gr.isLive) statusBadge='<span class="gm-live">LIVE</span>';
  if(gr&&gr.tm) timeInfo='<span class="tm-t">'+gr.d+' '+gr.tm+'</span>';
  else if(w1&&w2) timeInfo='<span style="font-size:9px;color:#475569">Time TBD</span>';
  var t1strike=gr&&gr.isFinal&&gr.winner&&!teamNamesMatch(gr.winner,w1||"");
  var t2strike=gr&&gr.isFinal&&gr.winner&&!teamNamesMatch(gr.winner,w2||"");
  var t1d=t1strike?'<span style="opacity:0.38;text-decoration:line-through">'+t1+'</span>':t1;
  var t2d=t2strike?'<span style="opacity:0.38;text-decoration:line-through">'+t2+'</span>':t2;
  return '<div class="gm">'
    +'<div class="tr"><span class="tn'+(w1?' bt':'')+'">'+t1d+'</span>'+statusBadge+'</div>'
    +'<div class="tr"><span class="tn" style="color:'+(w2?'#e2e8f0':'#334155')+'">'+t2d+'</span>'+timeInfo+'</div>'
    +'</div>';
}

function getRegionE8Winner(reg){
  var g=reg.g;
  // R32 winners
  var r32w=[];
  for(var i=0;i<4;i++){
    var a=bracketWinners[g[i*2].id];var b=bracketWinners[g[i*2+1].id];
    if(a&&b){var eg=findEspnScheduled(a,b);r32w.push(eg&&eg.winner?eg.winner:null);}
    else r32w.push(null);
  }
  // S16 winners
  var s16w=[];
  for(var i=0;i<2;i++){
    var a=r32w[i*2];var b=r32w[i*2+1];
    if(a&&b){var eg=findEspnScheduled(a,b);s16w.push(eg&&eg.winner?eg.winner:null);}
    else s16w.push(null);
  }
  // E8 winner
  if(s16w[0]&&s16w[1]){var eg=findEspnScheduled(s16w[0],s16w[1]);return eg&&eg.winner?eg.winner:null;}
  return null;
}

function findEspnScheduled(t1,t2){
  // t1 and t2 are abbreviated names from our bracket
  // We need to find the ESPN game matching these teams
  // CRITICAL: only mark as final/live if scores are real non-zero numbers
  // This prevents ESPN pre-seeded future games from showing as final
  for(var k in espnScheduled){
    var eg=espnScheduled[k];
    if(!eg.homeTeam||!eg.awayTeam) continue;
    if((teamNamesMatch(eg.homeTeam,t1)||teamNamesMatch(eg.awayTeam,t1))&&
       (teamNamesMatch(eg.homeTeam,t2)||teamNamesMatch(eg.awayTeam,t2))){
      var hs=parseInt(eg.homeScore)||0;
      var as=parseInt(eg.awayScore)||0;
      var hasRealScore=(hs+as)>10; // real game has meaningful combined score
      return {
        homeTeam:eg.homeTeam,awayTeam:eg.awayTeam,
        tm:eg.tm,tv:eg.tv,d:eg.d,
        isFinal:eg.isFinal&&hasRealScore,
        isLive:eg.isLive&&(hs>0||as>0),
        winner:eg.isFinal&&hasRealScore&&eg.winner?eg.winner:null,
        homeScore:eg.homeScore,awayScore:eg.awayScore
      };
    }
  }
  return null;
}

function buildRegion(reg,rev){
  var r1="",r2="",r3="",r4="",c1="",c2="",c3="";
  var g=reg.g;

  // R64 — 8 games
  for(var i=0;i<8;i++) r1+=gameCard(g[i]);

  // R32 — 4 slots, each fed by 2 R64 games
  // Pairs: (0,1), (2,3), (4,5), (6,7)
  for(var i=0;i<4;i++){
    var w1=bracketWinners[g[i*2].id]||null;
    var w2=bracketWinners[g[i*2+1].id]||null;
    var sched=w1&&w2?findEspnScheduled(w1,w2):null;
    r2+=liveSlot(g[i*2].id,g[i*2+1].id,'Round of 32',sched);
    c1+=connSvg(rev);
  }

  // Sweet 16 — 2 slots, each fed by 2 R32 winners
  // R32 winner pairs: (games 0-1 winner vs games 2-3 winner), (games 4-5 winner vs games 6-7 winner)
  var r32w=[];
  for(var i=0;i<4;i++) r32w.push(bracketWinners[g[i*2].id+'_r32_'+i]||bracketWinners['r32_'+reg.n+'_'+i]||null);
  // For S16, derive from R32 slots — use the R32 bracket winners if available
  // We track by the pair of R64 game IDs that feed each R32 slot
  var r32pairs=[[g[0].id,g[1].id],[g[2].id,g[3].id],[g[4].id,g[5].id],[g[6].id,g[7].id]];
  var r32winners=[];
  for(var i=0;i<4;i++){
    var rg=espnScheduled['r32_'+r32pairs[i][0]+'_'+r32pairs[i][1]];
    r32winners.push(rg&&rg.winner?rg.winner:(bracketWinners[r32pairs[i][0]+'_vs_'+r32pairs[i][1]]||null));
  }

  // S16 slots use R32 winners
  var s16keys=[r32pairs[0][0]+'_s16_'+r32pairs[1][0], r32pairs[2][0]+'_s16_'+r32pairs[3][0]];
  for(var i=0;i<2;i++){
    var sw1=r32winners[i*2]||null;
    var sw2=r32winners[i*2+1]||null;
    var ssched=sw1&&sw2?findEspnScheduled(sw1,sw2):null;
    // Build a fake slot with the winner names
    if(!sw1&&!sw2){r3+=slot('Sweet 16');}
    else{
      var st1=abbr(sw1)||'TBD';var st2=abbr(sw2)||'TBD';
      var sbadge='';var stimeInfo='';
      if(ssched&&ssched.tm) stimeInfo='<span class="tm-t">'+ssched.d+' '+ssched.tm+' '+ssched.tv+'</span>';
      else if(sw1&&sw2) stimeInfo='<span style="font-size:9px;color:#475569">Time TBD</span>';
      if(ssched&&ssched.isFinal&&sw1&&sw2) sbadge='<span class="gm-final">FINAL</span>';
      else if(ssched&&ssched.isLive&&sw1&&sw2) sbadge='<span class="gm-live">LIVE</span>';
      r3+='<div class="gm">'
        +'<div class="tr"><span class="tn'+(sw1?' bt':'')+'">'+st1+'</span>'+sbadge+'</div>'
        +'<div class="tr"><span class="tn" style="color:'+(sw2?'#e2e8f0':'#334155')+'">'+st2+'</span>'+stimeInfo+'</div>'
        +'</div>';
    }
    c2+=connSvg(rev);
  }

  // Elite 8 — 1 slot
  var s16winners=[null,null];
  for(var i=0;i<2;i++){
    var sw1=r32winners[i*2]||null;var sw2=r32winners[i*2+1]||null;
    if(sw1&&sw2){var esg=findEspnScheduled(sw1,sw2);if(esg&&esg.winner) s16winners[i]=esg.winner;}
  }
  var e1=s16winners[0];var e2=s16winners[1];
  var esched=e1&&e2?findEspnScheduled(e1,e2):null;
  if(!e1&&!e2){r4=slot('Elite 8');}
  else{
    var et1=abbr(e1)||'TBD';var et2=abbr(e2)||'TBD';
    var ebadge='';var etimeInfo='';
    if(esched&&esched.tm) etimeInfo='<span class="tm-t">'+esched.d+' '+esched.tm+' '+esched.tv+'</span>';
    else if(e1&&e2) etimeInfo='<span style="font-size:9px;color:#475569">Time TBD</span>';
    if(esched&&esched.isFinal&&e1&&e2) ebadge='<span class="gm-final">FINAL</span>';
    else if(esched&&esched.isLive&&e1&&e2) ebadge='<span class="gm-live">LIVE</span>';
    r4='<div class="gm">'
      +'<div class="tr"><span class="tn'+(e1?' bt':'')+'">'+et1+'</span>'+ebadge+'</div>'
      +'<div class="tr"><span class="tn" style="color:'+(e2?'#e2e8f0':'#334155')+'">'+et2+'</span>'+etimeInfo+'</div>'
      +'</div>';
  }
  c3=connSvg(rev);

  var cols=[rndWrap(r1),rndWrap(c1),rndWrap(r2),rndWrap(c2),rndWrap(r3),rndWrap(c3),rndWrap(r4)];
  if(rev) cols.reverse();
  var lbl='<div class="reg-label" style="color:'+reg.c+'">'+reg.n+'</div>';
  if(rev) return '<div class="reg-block">'+cols.join('')+lbl+'</div>';
  return '<div class="reg-block">'+lbl+cols.join('')+'</div>';
}


// ---- ESPN AUTO-GRADING ----

function teamNamesMatch(espnName, ourName){
  if(!espnName||!ourName) return false;
  var a=espnName.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
  var b=ourName.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();
  if(a===b) return true;
  // Exact substring match first
  if(a.indexOf(b)>=0||b.indexOf(a)>=0) return true;
  // Fuzzy word match — skip generic words that appear in many team names
  var skip={state:1,university:1,north:1,south:1,east:1,west:1,point:1,tech:1,college:1,the:1,and:1,northern:1,southern:1,eastern:1,western:1,central:1,national:1,saint:1,mount:1};
  var aw=a.split(' ');var bw=b.split(' ');
  for(var i=0;i<aw.length;i++){
    if(aw[i].length>3&&!skip[aw[i]]&&b.indexOf(aw[i])>=0) return true;
  }
  for(var i=0;i<bw.length;i++){
    if(bw[i].length>3&&!skip[bw[i]]&&a.indexOf(bw[i])>=0) return true;
  }
  return false;
}

function findGameByTeams(homeTeam, awayTeam){
  for(var i=0;i<flat.length;i++){
    var g=flat[i];
    if(!g.t1||!g.t2) continue;
    if((teamNamesMatch(homeTeam,g.t1)||teamNamesMatch(awayTeam,g.t1))&&
       (teamNamesMatch(homeTeam,g.t2)||teamNamesMatch(awayTeam,g.t2))){
      return g.id;
    }
  }
  return null;
}

var autoGradeLog=[];

function extractNumber(str){
  if(!str) return null;
  var m=str.match(/[-+]?\d+\.?\d*/);
  return m?parseFloat(m[0]):null;
}

function gradeTotal(betType, homeScore, awayScore){
  // betType examples: "Over 162", "Under 145.5", "Total Over 162"
  var bt=betType.toLowerCase();
  var line=extractNumber(betType);
  if(line===null) return null;
  var combined=parseInt(homeScore)+parseInt(awayScore);
  if(isNaN(combined)) return null;
  if(bt.indexOf('over')>=0) return combined>line?'win':combined===line?'push':'loss';
  if(bt.indexOf('under')>=0) return combined<line?'win':combined===line?'push':'loss';
  return null;
}

function gradeSpread(betType, team, homeTeam, awayTeam, homeScore, awayScore){
  // betType examples: "Spread -3.5", "Wisconsin -3.5", "-3.5"
  var line=extractNumber(betType);
  if(line===null) return null;
  var hs=parseInt(homeScore);var as=parseInt(awayScore);
  if(isNaN(hs)||isNaN(as)) return null;
  // Determine if bet team is home or away
  var betOnHome=teamNamesMatch(homeTeam,team);
  var betOnAway=teamNamesMatch(awayTeam,team);
  if(!betOnHome&&!betOnAway) return null;
  // margin from perspective of bet team
  var margin=betOnHome?(hs-as):(as-hs);
  var covered=margin+line;
  if(covered>0) return 'win';
  if(covered<0) return 'loss';
  return 'push';
}

function applyScores(games){
  var newGrades=0;
  for(var i=0;i<games.length;i++){
    var eg=games[i];
    var gid=findGameByTeams(eg.homeTeam,eg.awayTeam);
    if(!gid) continue;

    // Only update gameResults for R64 games to avoid future round contamination
    var isR64game=false;
    for(var ri=0;ri<flat.length;ri++){if(flat[ri].id===gid&&flat[ri].round==="R64"){isR64game=true;break;}}
    if(isR64game){
      var hs0=parseInt(eg.homeScore)||0;var as0=parseInt(eg.awayScore)||0;
      gameResults[gid]={
        isFinal:eg.isFinal&&(hs0>0||as0>0),
        isLive:eg.isLive,
        winner:eg.isFinal&&eg.winner?eg.winner:null,
        statusText:eg.statusText,
        homeTeam:eg.homeTeam,awayTeam:eg.awayTeam,
        homeScore:eg.homeScore,awayScore:eg.awayScore
      };
    }
    // Only advance bracket if game is truly final with a real score
    if(!eg.isFinal||!eg.winner) continue;
    // Sanity check: both scores must be non-zero numbers
    var hs=parseInt(eg.homeScore)||0;var as2=parseInt(eg.awayScore)||0;
    if(hs===0&&as2===0) continue;
    bracketWinners[gid]=eg.winner;

    for(var j=0;j<straightBets.length;j++){
      var b=straightBets[j];
      if(b.assignedGame!==gid) continue;
      if(b.result) continue;
      if(b.manuallyUngraded) continue;
      if(!b.team) continue;

      var bt=(b.betType||'').toLowerCase();
      var result=null;

      if(bt.indexOf('total')>=0||bt.indexOf('over')>=0||bt.indexOf('under')>=0){
        // Total bet — grade by combined score
        result=gradeTotal(b.betType,eg.homeScore,eg.awayScore);
      }else if(bt.indexOf('spread')>=0||bt.indexOf('-')>=0||bt.indexOf('+')>=0){
        // Spread bet — grade by margin
        result=gradeSpread(b.betType,b.team,eg.homeTeam,eg.awayTeam,eg.homeScore,eg.awayScore);
        // Fallback to moneyline if spread parse fails
        if(!result) result=teamNamesMatch(eg.winner,b.team)?'win':'loss';
      }else{
        // Moneyline
        result=teamNamesMatch(eg.winner,b.team)?'win':'loss';
      }

      if(result){
        b.result=result;
        b.autoGraded=true;
        newGrades++;
        autoGradeLog.push({team:b.team,result:b.result,game:gid});
      }
    }
  }
  return newGrades;
}

function fetchScores(){
  fetch(API_BASE_URL+'/api/scores')
    .then(function(r){return r.json();})
    .then(function(data){
      if(!data.games) return;
      // Store ALL games in espnScheduled for later-round scheduling info
      // But only mark as final/live if scores are real (non-zero)
      for(var i=0;i<data.games.length;i++){
        var eg=data.games[i];
        var key=(eg.homeTeam+'_'+eg.awayTeam).toLowerCase().replace(/[^a-z0-9_]/g,'');
        var hs=parseInt(eg.homeScore)||0;var as=parseInt(eg.awayScore)||0;
        var hasRealScore=(hs+as)>10;
        // Only treat as final if game date is in the past AND scores are real
        var gameDatePast=eg.gameDate?new Date(eg.gameDate)<new Date():false;
        var realGame=eg.isFinal&&hasRealScore&&gameDatePast;
        espnScheduled[key]={
          homeTeam:eg.homeTeam,awayTeam:eg.awayTeam,
          tm:eg.statusText||'',tv:'',d:'',
          isFinal:realGame,
          isLive:eg.isLive&&(hs>0||as>0),
          winner:realGame&&eg.winner?eg.winner:null,
          homeScore:eg.homeScore,awayScore:eg.awayScore
        };
      }
      // CRITICAL: only update gameResults for our known R64 games
      // This prevents future round ESPN games from showing FINAL on R64 cards
      for(var i=0;i<data.games.length;i++){
        var eg=data.games[i];
        var gid=findGameByTeams(eg.homeTeam,eg.awayTeam);
        if(!gid) continue;
        // Only update gameResults if this is a known R64 game in our flat[] array
        var isR64=false;
        for(var j=0;j<flat.length;j++){
          if(flat[j].id===gid&&flat[j].round==='R64'){isR64=true;break;}
        }
        if(!isR64) continue;
        var hs2=parseInt(eg.homeScore)||0;var as2=parseInt(eg.awayScore)||0;
        gameResults[gid]={
          isFinal:eg.isFinal&&(hs2>0||as2>0),
          isLive:eg.isLive,
          winner:eg.isFinal&&eg.winner?eg.winner:null,
          statusText:eg.statusText,
          homeTeam:eg.homeTeam,awayTeam:eg.awayTeam,
          homeScore:eg.homeScore,awayScore:eg.awayScore
        };
      }
      var graded=applyScores(data.games);
      lastScoreFetch=Date.now();
      if(graded>0||Object.keys(gameResults).length>0) draw();
    })
    .catch(function(){});
}

function startScorePolling(){
  fetchScores(); // immediate first fetch
  if(scoreFetchInterval) clearInterval(scoreFetchInterval);
  scoreFetchInterval=setInterval(fetchScores, 120000); // every 2 min
}


function getRoundStats(){
  var rounds={R64:{n:"Round of 64",bets:0,wi:0,lo:0,st:0,pl:0},R32:{n:"Round of 32",bets:0,wi:0,lo:0,st:0,pl:0},S16:{n:"Sweet 16",bets:0,wi:0,lo:0,st:0,pl:0},E8:{n:"Elite 8",bets:0,wi:0,lo:0,st:0,pl:0},F4:{n:"Final Four",bets:0,wi:0,lo:0,st:0,pl:0},Championship:{n:"Championship",bets:0,wi:0,lo:0,st:0,pl:0}};
  for(var i=0;i<straightBets.length;i++){
    var b=straightBets[i];
    var g=null;for(var j=0;j<flat.length;j++){if(flat[j].id===b.assignedGame){g=flat[j];break;}}
    var rk=g?g.round:"R64";
    if(!rounds[rk]) continue;
    rounds[rk].bets++;rounds[rk].st+=b.stake||0;
    if(b.result==="win"){rounds[rk].wi++;rounds[rk].pl+=(b.potentialPayout||0)-(b.stake||0);}
    if(b.result==="loss"){rounds[rk].lo++;rounds[rk].pl-=(b.stake||0);}
  }
  return rounds;
}

function getParlayStats(){
  var total=0,wi=0,lo=0,st=0,pl=0;
  for(var i=0;i<parlays.length;i++){
    var p=parlays[i];total++;st+=p.stake||0;
    if(p.result==="win"){wi++;pl+=(p.potentialPayout||0)-(p.stake||0);}
    if(p.result==="loss"){lo++;pl-=(p.stake||0);}
  }
  return{total:total,wi:wi,lo:lo,st:st,pl:pl};
}

      h+='<div class="empty-state"><div class="icon"></div><div style="font-size:16px;font-weight:700">No parlays yet</div><div style="font-size:12px;margin-top:8px;color:#334155">Upload a bet slip with a parlay to get started</div></div>';
    }else{
      for(var i=0;i<parlays.length;i++){
        var p=parlays[i];
        var pp=p.result==="win"?((p.potentialPayout||0)-(p.stake||0)):p.result==="loss"?-(p.stake||0):0;
        var btns="";
        if(!p.result){
          btns='<div style="display:flex;gap:6px;margin-top:8px">';
          btns+='<button class="rbt" data-r="win" data-b="'+p.id+'" data-type="parlay" style="background:#10b981">WIN</button>';
          btns+='<button class="rbt" data-r="loss" data-b="'+p.id+'" data-type="parlay" style="background:#ef4444">LOSS</button>';
          btns+='<button class="rbt" data-r="push" data-b="'+p.id+'" data-type="parlay" style="background:#f59e0b">PUSH</button></div>';
        }else{
          var xc=p.result==="win"?"#10b981":p.result==="loss"?"#ef4444":"#f59e0b";
          btns='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">'
            +'<span style="font-weight:700;font-size:14px;color:'+xc+'">'+( pp>=0?"+":"")+'$'+Math.abs(pp).toFixed(2)+'</span>'
            +'<div style="display:flex;gap:5px">'
            +'<button class="rbt" data-r="undo" data-b="'+p.id+'" data-type="parlay" style="background:#1e293b;flex:0;padding:4px 8px;font-size:10px">Undo</button>'
            +'<button onclick="deleteBet(this.getAttribute(\'data-id\'),\'parlay\')" class="rbt" style="background:#450a0a;color:#ef4444;flex:0;padding:4px 8px;font-size:10px" data-id='+p.id+'>Delete</button>'
            +'</div></div>';
        }
        var legCount=p.legs?p.legs.length:0;
        h+='<div class="pi">';
        h+='<div style="display:flex;justify-content:space-between;align-items:center">';
        h+='<div><span style="font-weight:700;font-size:14px;color:#f97316">'+legCount+'-Leg Parlay</span>';
        h+='<span style="color:#64748b;font-size:11px;margin-left:6px">'+p.sportsbook+'</span></div>';
        h+='<div style="font-weight:700">$'+(p.stake||0).toFixed(2)+' &rarr; $'+(p.potentialPayout||0).toFixed(2)+'</div></div>';
        if(p.legs&&p.legs.length){
          h+='<div class="parlay-legs">';
          for(var j=0;j<p.legs.length;j++){
            var leg=p.legs[j];
            h+='<div class="leg"><span class="leg-dot"></span><span style="color:#fbbf24;font-weight:600">'+(leg.team||"?")+'</span>&nbsp;<span style="color:#64748b">'+(leg.betType||"")+'</span>&nbsp;<span style="color:#94a3b8">'+(leg.odds||"")+'</span></div>';
          }
          h+='</div>';
        }
        h+=btns+'</div>';
      }
    }
    h+='</div>';

  }else if(curTab==="stats"){
    var rs=getRoundStats();
    var ps2=getParlayStats();
    h+='<div class="lst">';
    h+='<div style="font-size:15px;font-weight:800;margin-bottom:12px;color:#e2e8f0">Round-by-Round Stats</div>';
    var rounds=["R64","R32","S16","E8","F4","Championship"];
    for(var ri2=0;ri2<rounds.length;ri2++){
      var rk=rounds[ri2];
      var rd=rs[rk];
      if(!rd) continue;
      var rplC=rd.pl>=0?"#10b981":"#ef4444";
      h+='<div class="bi" style="border-left-color:#00b4d8;margin-bottom:8px">';
      h+='<div style="display:flex;justify-content:space-between;align-items:center">';
      h+='<div><span style="font-weight:800;font-size:14px;color:#00b4d8">'+rd.n+'</span></div>';
      h+='<div style="font-weight:700;color:'+rplC+'">'+(rd.pl>=0?"+":"")+'$'+Math.abs(rd.pl).toFixed(2)+'</div></div>';
      h+='<div style="display:flex;gap:20px;margin-top:8px;font-size:12px">';
      h+='<span><span style="color:#64748b">Bets: </span><span style="font-weight:700">'+rd.bets+'</span></span>';
      h+='<span><span style="color:#64748b">Record: </span><span style="font-weight:700">'+rd.wi+'-'+rd.lo+'</span></span>';
      h+='<span><span style="color:#64748b">Staked: </span><span style="font-weight:700">$'+rd.st.toFixed(2)+'</span></span>';
      h+='</div></div>';
    }
    // Parlay summary row
    h+='<div style="font-size:15px;font-weight:800;margin:16px 0 12px;color:#e2e8f0">Parlay Summary</div>';
    var pplC=ps2.pl>=0?"#10b981":"#ef4444";
    h+='<div class="pi" style="margin-bottom:8px">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center">';
    h+='<span style="font-weight:800;font-size:14px;color:#f97316">All Parlays</span>';
    h+='<span style="font-weight:700;color:'+pplC+'">'+(ps2.pl>=0?"+":"")+'$'+Math.abs(ps2.pl).toFixed(2)+'</span></div>';
    h+='<div style="display:flex;gap:20px;margin-top:8px;font-size:12px">';
    h+='<span><span style="color:#64748b">Parlays: </span><span style="font-weight:700">'+ps2.total+'</span></span>';
    h+='<span><span style="color:#64748b">Record: </span><span style="font-weight:700">'+ps2.wi+'-'+ps2.lo+'</span></span>';
    h+='<span><span style="color:#64748b">Staked: </span><span style="font-weight:700">$'+ps2.st.toFixed(2)+'</span></span>';
    h+='</div></div>';
    h+='</div>';
  }

  // Upload modal
  if(showUploadModal){
    h+='<div class="upload-modal" id="uploadModal">';
    h+='<div class="upload-box">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">';
    h+='<div style="font-size:16px;font-weight:800;color:#e2e8f0">Upload Bet Slips</div>';
    h+='<button onclick="closeUploadModal()" style="background:none;border:none;color:#64748b;font-size:20px;cursor:pointer;line-height:1">x</button>';
    h+='</div>';
    h+='<div class="upload-drop-zone" id="dropZone">' ;
    h+='<label for="fi" style="display:block;cursor:pointer;width:100%;height:100%">' ;
    h+='<div class="dz-icon">+</div>';
    h+='<div class="dz-title">Drop bet slips here</div>';
    h+='<div class="dz-sub">or click to browse files</div>';
    h+='<div class="dz-sub" style="margin-top:6px;color:#334155">Supports DraftKings, FanDuel, BetMGM, ProphetX, Caesars &amp; more</div>';
    h+='</label>';
    h+='</div>';
    h+='<div style="font-size:11px;color:#475569;text-align:center">Multiple files supported &mdash; AI reads your slips automatically</div>';
    h+='</div></div>';
  }


  // Game modal
  if(activeGameModal){
    var mg=null;for(var i=0;i<flat.length;i++){if(flat[i].id===activeGameModal){mg=flat[i];break;}}
    var mgBets=[];for(var i=0;i<straightBets.length;i++){if(straightBets[i].assignedGame===activeGameModal)mgBets.push(straightBets[i]);}
    var gr=gameResults[activeGameModal];
    h+='<div class="modal-overlay" onclick="closeModal()">';
    h+='<div class="modal-box" onclick="event.stopPropagation()">';
    h+='<button class="modal-close" onclick="closeModal()">x</button>';
    if(mg&&mg.t1){
      h+='<h3>'+(mg.t1||'')+(mg.s1?' ('+mg.s1+')':'')+' vs '+(mg.t2||'')+(mg.s2?' ('+mg.s2+')':'')+' </h3>';
    }else{
      h+='<h3>Game Bets</h3>';
    }
    if(gr){
      var sc=gr.isFinal?'<span class="gm-final">FINAL</span>':gr.isLive?'<span class="gm-live">LIVE</span>':'';
      if(gr.homeScore||gr.awayScore) h+='<div style="font-size:12px;color:#94a3b8;margin-bottom:10px">'+sc+' '+gr.awayTeam+' '+gr.awayScore+' - '+gr.homeScore+' '+gr.homeTeam+'</div>';
    }
    if(!mgBets.length){
      h+='<div style="text-align:center;padding:20px;color:#475569;font-size:13px">No bets on this game</div>';
    }else{
      for(var i=0;i<mgBets.length;i++){
        var mb=mgBets[i];
        var mbp=mb.result==="win"?((mb.potentialPayout||0)-(mb.stake||0)):mb.result==="loss"?-(mb.stake||0):null;
        var mbc=mb.result==="win"?"#10b981":mb.result==="loss"?"#ef4444":mb.result==="push"?"#f59e0b":"#94a3b8";
        var isHalf=isFirstHalfBet(mb);var isProp=isPropBet(mb);
        var tag=isHalf?'<span style="font-size:9px;background:#1e3a5f;color:#60a5fa;padding:1px 5px;border-radius:3px;margin-left:4px">1H</span>':isProp?'<span style="font-size:9px;background:#3b1f5f;color:#c084fc;padding:1px 5px;border-radius:3px;margin-left:4px">PROP</span>':'';
        var needsManual=(isHalf||isProp)&&!mb.result;
        h+='<div class="modal-bet" style="border-left-color:'+mbc+'">';
        h+='<div style="display:flex;justify-content:space-between;align-items:center">';
        h+='<div><span style="font-weight:700;color:#fbbf24;font-size:13px">'+(mb.betType||mb.team||"?")+tag+'</span>';
        if(mb.team) h+='<div style="font-size:10px;color:#64748b;margin-top:2px">'+mb.team+'</div>';
        h+='</div>';
        h+='<div style="text-align:right"><div style="font-weight:700;font-size:12px">$'+(mb.stake||0).toFixed(2)+' @ '+(mb.odds||"?")+'</div>';
        if(mbp!==null) h+='<div style="font-weight:700;color:'+mbc+';font-size:12px">'+(mbp>=0?"+":"")+"$"+Math.abs(mbp).toFixed(2)+'</div>';
        h+='</div></div>';
        if(needsManual){
          h+='<div style="font-size:10px;color:#475569;margin-top:6px;margin-bottom:4px">Grade manually:</div>';
          h+='<div style="display:flex;gap:5px">';
          h+='<button class="rbt" data-r="win" data-b="'+mb.id+'" data-type="straight" style="background:#10b981">WIN</button>';
          h+='<button class="rbt" data-r="loss" data-b="'+mb.id+'" data-type="straight" style="background:#ef4444">LOSS</button>';
          h+='<button class="rbt" data-r="push" data-b="'+mb.id+'" data-type="straight" style="background:#f59e0b">PUSH</button>';
          h+='</div>';
        }else if(mb.result){
          h+='<div style="font-size:10px;color:'+mbc+';margin-top:4px;font-weight:700">'+mb.result.toUpperCase()+(mb.autoGraded?' — Auto-graded':'')+'</div>';
        }else{
          h+='<div style="font-size:10px;color:#475569;margin-top:4px">Pending — auto-grades when final</div>';
        }
        h+='</div>';
      }
    }
    h+='</div></div>';
  }

  h+='</div>';
  document.getElementById("app").innerHTML=h;
  bindEvents();
}

function bindEvents(){
  var upBtn=document.getElementById("upBtn");
  if(upBtn) upBtn.addEventListener("click",function(){if(!isParsing){showUploadModal=true;draw();}});

  var fi=document.getElementById("fi");
  if(fi) fi.addEventListener("change",function(){
    var files=this.files;
    if(!files||!files.length) return;
    showUploadModal=false;
    doUpload(files);
    this.value="";
  });

  var tabs=document.querySelectorAll("[data-tab]");
  for(var i=0;i<tabs.length;i++){
    tabs[i].addEventListener("click",function(){curTab=this.getAttribute("data-tab");draw();});
  }

  var selects=document.querySelectorAll("[data-assign]");
  for(var i=0;i<selects.length;i++){
    selects[i].addEventListener("change",function(){
      var bid=this.getAttribute("data-assign");
      var gid=this.value;
      if(!gid) return;
      for(var j=0;j<straightBets.length;j++){if(straightBets[j].id===bid){straightBets[j].assignedGame=gid;break;}}
      saveToStorage();
      draw();
    });
  }

  // Upload modal drop zone drag events
  var dz=document.getElementById("dropZone");
  if(dz){
    dz.addEventListener("dragover",function(ev){ev.preventDefault();dz.classList.add("drag-over");});
    dz.addEventListener("dragleave",function(){dz.classList.remove("drag-over");});
    dz.addEventListener("drop",function(ev){
      ev.preventDefault();dz.classList.remove("drag-over");
      var files=ev.dataTransfer.files;
      if(files&&files.length&&!isParsing){showUploadModal=false;doUpload(files);}
    });
  }

  // Drag and drop anywhere on page
  var overlay=document.getElementById("dragOverlay");
  var dragCounter=0;
  document.addEventListener("dragenter",function(ev){
    ev.preventDefault();
    dragCounter++;
    if(overlay) overlay.className="drag-overlay active";
  });
  document.addEventListener("dragleave",function(ev){
    dragCounter--;
    if(dragCounter<=0){dragCounter=0;if(overlay) overlay.className="drag-overlay";}
  });
  document.addEventListener("dragover",function(ev){ev.preventDefault();});
  document.addEventListener("drop",function(ev){
    ev.preventDefault();
    dragCounter=0;
    if(overlay) overlay.className="drag-overlay";
    var files=ev.dataTransfer.files;
    if(files&&files.length&&!isParsing) doUpload(files);
  });

  document.getElementById("app").addEventListener("click",function(ev){
    var el=ev.target;
    if(el.getAttribute&&el.getAttribute("data-b")){
      var bid=el.getAttribute("data-b");
      var rv=el.getAttribute("data-r");
      var btype=el.getAttribute("data-type");
      var arr=btype==="parlay"?parlays:straightBets;
      for(var i=0;i<arr.length;i++){
        if(arr[i].id===bid){
          if(rv==="undo"){arr[i].result=null;arr[i].autoGraded=false;arr[i].manuallyUngraded=true;}
          else{arr[i].result=rv;arr[i].manuallyUngraded=false;}
          break;
        }
      }
      draw();
    }
  });
}

function setParsingState(active,msg){
  isParsing=active;
  var bar=document.getElementById("parsingBar");
  if(bar){
    bar.className="parsing-bar"+(active?" active":"");
    var msgEl=document.getElementById("parsingMsg");
    if(msgEl&&msg) msgEl.textContent=msg;
  }
}

function doUpload(files){
  if(!files||!files.length) return;
  var idx=0;
  function next(){
    if(idx>=files.length){setParsingState(false);draw();return;}
    var f=files[idx];idx++;
    setParsingState(true,"Parsing "+f.name+" ("+idx+" of "+files.length+")...");
    var reader=new FileReader();
    reader.onerror=function(){logz.push({f:f.name,ok:false,msg:"Failed to read file"});next();};
    reader.onload=function(){
      var b64=reader.result.split(",")[1];
      var mediaType=f.type||"image/png";
      fetch(API_BASE_URL+"/api/parse-slip",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({image:b64,mediaType:mediaType})
      }).then(function(r){return r.json();}).then(function(data){
        if(data.error){logz.push({f:f.name,ok:false,msg:data.error});next();return;}
        var txt="";
        for(var c=0;c<data.content.length;c++){txt+=data.content[c].text||"";}
        var clean="";
        for(var i=0;i<txt.length;i++){if(txt.charAt(i)!=="`") clean+=txt.charAt(i);}
        clean=clean.trim();
        if(clean.indexOf("json")===0) clean=clean.substring(4).trim();
        var parsed=JSON.parse(clean);

        // Parsed result is either an array (for straight) or object with bets+parlays
        var straightArr=[];
        var parlayArr=[];

        if(Array.isArray(parsed)){
          // Separate parlays from straight bets
          for(var j=0;j<parsed.length;j++){
            var item=parsed[j];
            if(item.isParlay||item.betType==="Parlay"||(item.legs&&item.legs.length>1)){
              parlayArr.push(item);
            }else{
              straightArr.push(item);
            }
          }
        }else if(parsed.bets||parsed.parlays){
          straightArr=parsed.bets||[];
          parlayArr=parsed.parlays||[];
        }

        var newStraight=0,newParlay=0;
        for(var j=0;j<straightArr.length;j++){
          var item=straightArr[j];
          straightBets.push({
            team:item.team,opponent:item.opponent,game:item.game,
            betType:item.betType,odds:item.odds,
            id:"b"+Date.now()+"_"+j,
            stake:parseFloat(item.stake)||0,
            potentialPayout:parseFloat(item.potentialPayout)||0,
            result:null,
            assignedGame:matchBet(item)
          });
          newStraight++;
        }
        for(var j=0;j<parlayArr.length;j++){
          var item=parlayArr[j];
          parlays.push({
            id:"p"+Date.now()+"_"+j,
            sportsbook:item.sportsbook||"",
            stake:parseFloat(item.stake)||0,
            potentialPayout:parseFloat(item.potentialPayout)||0,
            legs:item.legs||[],
            result:null
          });
          newParlay++;
        }
        var msg="";
        if(newStraight>0) msg+=newStraight+" straight bet"+(newStraight>1?"s":"");
        if(newParlay>0) msg+=(msg?", ":"")+newParlay+" parlay"+(newParlay>1?"s":"");
        logz.push({f:f.name,ok:true,n:msg||"0 bets"});
        saveToStorage();
        next();
      }).catch(function(){logz.push({f:f.name,ok:false,msg:"Network error - check API_BASE_URL"});next();});
    };
    reader.readAsDataURL(f);
  }
  next();
}

loadFromStorage();
startScorePolling();
draw();
</script>
</body>
</html>
